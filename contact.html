<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Brandon Keck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1117;
    --navbg:#05070B;
    --card:#161B22;
    --line:#21262D;
    --ink:#E6EDF3;
    --ink-soft:#8B949E;
    --teal:#00BFA5;
    --serif:'Fraunces', Georgia, serif;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
  }

  a{color:inherit; text-decoration:none;}
  .wrap{max-width:960px; margin:0 auto; padding:0 24px;}

  /* Nav */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--navbg);
  }
  nav.wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:16px; padding-bottom:16px;
  }
  .brand{font-family:var(--serif); font-size:1.15rem; font-weight:500; color:#fff;}
  .navlinks{display:flex; gap:28px; font-size:0.95rem;}
  .navlinks a{position:relative; padding-bottom:4px; color:#9AA6B2;}
  .navlinks a.active{color:var(--teal);}
  .navlinks a.active::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--teal);
  }
  .navlinks a:hover{color:#fff;}
  .navtoggle{display:none; background:none; border:none; font-size:1.4rem; cursor:pointer; color:#fff;}

  @media (max-width:720px){
    .navlinks{
      display:none; position:absolute; top:100%; left:0; right:0;
      flex-direction:column; gap:0; background:var(--navbg);
      border-top:1px solid #1B2534;
    }
    .navlinks.open{display:flex;}
    .navlinks a{padding:14px 24px; border-top:1px solid #1B2534;}
    .navtoggle{display:block;}
  }

  /* Contact section */
  .contact-section{
    min-height:60vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:80px 0;
  }
  h1.page-title{
    font-family:var(--serif); font-weight:500; font-size:clamp(2rem, 4vw, 2.6rem);
    margin:0 0 14px;
  }
  .page-lead{color:var(--ink-soft); font-size:1rem; margin:0 0 40px;}

  .contact-links{
    display:flex; flex-wrap:wrap; justify-content:center; gap:16px;
  }
  .contact-btn{
    display:inline-flex; align-items:center; gap:10px;
    border:1px solid var(--line); background:var(--card);
    color:var(--ink); font-size:0.95rem; font-weight:500;
    padding:12px 22px; border-radius:6px;
    transition:border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .contact-btn:hover{
    border-color:var(--teal); color:var(--teal);
  }
  .contact-btn .icon{font-size:1.1rem;}

  footer{
    border-top:1px solid var(--line);
    padding:32px 0; font-size:0.85rem; color:var(--ink-soft); text-align:center;
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a class="brand" href="index.html">Brandon Keck's Portfolio</a>
    <button class="navtoggle" id="navtoggle" aria-label="Toggle navigation">&#9776;</button>
    <div class="navlinks" id="navlinks">
      <a href="index.html">Home</a>
      <a href="employment.html">Experience</a>
      <a href="projects.html">Projects</a>
      <a href="visualizations.html">Visualization</a>
      <a class="active" href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<div class="wrap">
  <section class="contact-section">
    <h1 class="page-title">Contact Me</h1>
    <p class="page-lead">Feel free to reach out via LinkedIn or email!</p>

    <div class="contact-links">
      <a href="assets/css/images/home_imgs/Resume-30.pdf" target="_blank" rel="noopener noreferrer" class="contact-btn">
        <span class="icon">📄</span> Resume
      </a>
      <a href="https://www.linkedin.com/in/brandon-keck-statistician" target="_blank" rel="noopener noreferrer" class="contact-btn">
        <span class="icon">💼</span> LinkedIn
      </a>
      <a href="https://github.com/brandon-keck" target="_blank" rel="noopener noreferrer" class="contact-btn">
        <span class="icon">💻</span> GitHub
      </a>
      <a href="mailto:brandon.keck87@gmail.com" class="contact-btn">
        <span class="icon">✉️</span> Email
      </a>
    </div>
  </section>
</div>

<footer>
  <div class="wrap">© 2026 Brandon Keck</div>
</footer>

<script>
  document.getElementById('navtoggle').addEventListener('click', function(){
    document.getElementById('navlinks').classList.toggle('open');
  });
</script>

</body>
</html>
